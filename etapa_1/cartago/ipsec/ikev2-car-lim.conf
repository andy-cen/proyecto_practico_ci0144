connections {
    car-lim {
        # version = 2 fuerza IKEv2 (evita fallback silencioso a IKEv1)
        version = 2

        # Direcciones de los extremos del túnel (las IPs WAN de los equipos de borde)
        local_addrs  = 172.24.133.84
        remote_addrs = 172.24.133.80

        local {
            auth = psk
            id = 172.24.133.84
        }
        remote {
            auth = psk
            id = 172.24.133.80
        }

        # child = la SA de datos (equivalente conceptual a las SAs que armaron a mano con ip xfrm)
        children {
            car-lim-child {
                # Subredes que este túnel protege — deben coincidir EXACTO con el otro lado (invertidas)
                local_ts  = 10.4.32.0/20
                remote_ts = 10.4.16.0/20

                # Mismo algoritmo que usaron en el túnel manual, para comparación justa en el reporte
                esp_proposals = aes256-sha256-modp2048

                start_action = start      # levanta el túnel automáticamente al cargar la config
                dpd_action = restart      # si el peer deja de responder, reintenta solo
                life_time = 1h            # vida máxima de la CHILD_SA antes de renegociar (PFS en acción)
                rekey_time = 51m          # renegocia un poco antes de que expire, sin caída de servicio
            }
        }

        # Propuesta para la fase IKE (autenticación/negociación inicial)
        proposals = aes256-sha256-modp2048
        rekey_time = 8h        # renegociación de la IKE_SA (la "sesión" completa, no solo los datos)
        dpd_delay = 30s        # cada cuánto verifica que el peer sigue vivo
        dpd_timeout = 120s     # cuánto espera antes de darlo por caído
    }
}

secrets {
    ike-car-lim {
        id-1 = 172.24.133.84
        id-2 = 172.24.133.80
        secret = "AQUÍ VA LA CLAVE SECRETA QUE USAN AMBOS LADOS PARA AUTENTICARSE"
    }
}
