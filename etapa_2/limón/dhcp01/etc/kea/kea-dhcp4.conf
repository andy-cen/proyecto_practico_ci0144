{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "ens33" ]
    },

    "control-socket": {
      "socket-type": "unix",
      "socket-name": "kea4-ctrl-socket"
    },

    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv",
      "lfc-interval": 3600
    },

    "hooks-libraries": [
      {
        "library": "/usr/lib64/kea/hooks/libdhcp_lease_cmds.so"
      },
      {
	"library": "/usr/lib64/kea/hooks/libdhcp_stat_cmds.so"
      },
      {
        "library": "/usr/lib64/kea/hooks/libdhcp_ha.so",
        "parameters": {
          "high-availability": [
            {
              "this-server-name": "lim",
              "mode": "hot-standby",

              "multi-threading": {
                "enable-multi-threading": true,
                "http-dedicated-listener": true,
                "http-listener-threads": 0,
                "http-client-threads": 0
              },

              "heartbeat-delay": 10000,
              "max-response-delay": 60000,
              "max-ack-delay": 5000,
              "max-unacked-clients": 1,

              "peers": [
                {
                  "name": "sjo",
                  "url": "http://10.4.1.10:8000/",
                  "role": "primary",
                  "auto-failover": true
                },
                {
                  "name": "lim",
                  "url": "http://10.4.17.10:8000/",
                  "role": "standby",
                  "auto-failover": true
                }
              ]
            }
          ]
        }
      }
    ],

    "dhcp-ddns": {
	"enable-updates": true,
	"server-ip": "127.0.0.1",
	"server-port": 53001,
	"sender-ip": "127.0.0.1",
	"sender-port": 0,
	"max-queue-size": 1024,
	"ncr-protocol": "UDP",
	"ncr-format": "JSON"
    },

    "ddns-send-updates": true,
    "ddns-qualifying-suffix": "dhcp.g04.ci0144.cr.",
    "ddns-replace-client-name": "when-not-present",

    "subnet4": [
      {
        "id": 105,
        "subnet": "10.4.5.0/24",

        "pools": [
          {
            "pool": "10.4.5.100 - 10.4.5.199"
