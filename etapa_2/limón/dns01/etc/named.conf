//
// named.conf
//
// Provided by Red Hat bind package to configure the ISC BIND named(8) DNS
// server as a caching only nameserver (as a localhost DNS resolver only).
//
// See /usr/share/doc/bind*/sample/ for example named configuration files.
//
	
include "/etc/named/transfer-g04.key";

options {
	listen-on port 53 {
                127.0.0.1;
                10.4.19.20;
        };

        listen-on-v6 port 53 { ::1; };

        directory "/var/named";

        recursion no;
	querylog yes;
        allow-recursion { none; };

        allow-query { any; };

        allow-transfer { none; };

        version "not disclosed";

        rate-limit {
                responses-per-second 10;
                window 5;
        };

        dnssec-validation no;
};

logging {
        channel default_debug {
                file "data/named.run";
                severity dynamic;
        };

        channel query_log {
                file "/var/log/named/queries.log" versions 5 size 10m;
                severity info;
                print-time yes;
                print-category yes;
                print-severity yes;
        };

        category queries {
                query_log;
        };
};

zone "." IN {
	type hint;
	file "named.ca";
};

zone "g04.ci0144.cr" IN {
        type secondary;
        file "slaves/g04.ci0144.cr.zone";

        primaries {
                10.4.1.20 key transfer-g04;
        };

        allow-query { any; };
        allow-transfer { none; };
}; 

include "/etc/named.rfc1912.zones";
include "/etc/named.root.key";

