acl "internal-networks" {
        127.0.0.1;
        10.4.0.0/16;
};

options {
        listen-on port 53 {
                127.0.0.1;
                10.4.1.21;
        };

        listen-on-v6 port 53 { ::1; };

        directory "/var/named";

        dump-file "/var/named/data/cache_dump.db";
        statistics-file "/var/named/data/named_stats.txt";
        memstatistics-file "/var/named/data/named_mem_stats.txt";

        recursion yes;

        allow-query {
                internal-networks;
        };

        allow-recursion {
                internal-networks;
        };

        allow-query-cache {
                internal-networks;
        };

        version "not disclosed";

        dnssec-validation auto;

	validate-except {
		"g04.ci0144.cr";
	};	

        pid-file "/run/named/named.pid";
        session-keyfile "/run/named/session.key";

        include "/etc/crypto-policies/back-ends/bind.config";
};

logging {
        channel query_log {
                file "/var/named/log/queries.log" versions 5 size 10m;
                severity info;
                print-time yes;
                print-severity yes;
                print-category yes;
        };

        channel default_debug {
                file "/var/named/data/named.run";
                severity dynamic;
        };

        category queries {
                query_log;
        };
};

include "/etc/named.rfc1912.zones";
include "/etc/named.root.key";

zone "g04.ci0144.cr" IN {
    type forward;
    forward only;
    forwarders {
        10.4.1.20;
        10.4.19.20;
    };
};

