include "/etc/named/transfer-g04.key";
include "/etc/named/ddns-g04.key";

acl "secondary-transfer" {
    !{ !key "transfer-g04"; any; };
    10.4.19.20;
    10.4.35.20;
};

options {
        listen-on port 53 { 127.0.0.1; 10.4.1.20; };
        listen-on-v6 port 53 { ::1; };

        directory       "/var/named";
        dump-file       "/var/named/data/cache_dump.db";
        statistics-file "/var/named/data/named_stats.txt";
        memstatistics-file "/var/named/data/named_mem_stats.txt";

        // Servidor exclusivamente autoritativo
        recursion no;
        allow-recursion { none; };

        // Por ahora permitimos consultas desde cualquier origen.
        // El hidden primary se protegera adicionalmente mediante firewall.
        allow-query { any; };

        // Ocultar informacion de la implementacion
        version "not disclosed";

        // Response Rate Limiting
        rate-limit {
                responses-per-second 10;
                window 5;
        };

        // Las transferencias se habilitaran posteriormente
        // exclusivamente para los secundarios mediante IP + TSIG.
        allow-transfer { none; };

        pid-file "/run/named/named.pid";
        session-keyfile "/run/named/session.key";

        include "/etc/crypto-policies/back-ends/bind.config";
};

logging {
        channel query_log {
                file "/var/named/log/queries.log" versions 5 size 10m;
                severity info;
                print-time yes;
                print-severity yes;
                print-category yes;
        };

        channel default_debug {
                file "/var/named/data/named.run";
                severity dynamic;
        };

        category queries {
                query_log;
        };
};

// Las zonas autoritativas se declararan aqui posteriormente.

dnssec-policy "g04-policy" {
        keys {
                csk lifetime 180d algorithm ECDSAP256SHA256;
        };
};

zone "g04.ci0144.cr" IN {
        type primary;
        file "master/g04.ci0144.cr.zone";

        allow-transfer { secondary-transfer; };

	notify yes;
	also-notify {
		10.4.19.20 key transfer-g04;
		10.4.35.20 key transfer-g04;
	};

        dnssec-policy "g04-policy";
        inline-signing yes;

        update-policy {
		grant ddns-g04 subdomain dhcp.g04.ci0144.cr. A TXT DHCID;
	};
};

zone "1.4.10.in-addr.arpa" IN {
    type primary;
    file "master/1.4.10.in-addr.arpa.zone";

    allow-query { any; };
    allow-transfer { secondary-transfer; };
   
    notify yes;
