module(load="imudp")
module(load="imtcp")

template(name="SJOFirewall" type="string" string="/var/log/remote/SJO/firewall01/%PROGRAMNAME%.log")
template(name="SJODHCP" type="string" string="/var/log/remote/SJO/dhcp01/%PROGRAMNAME%.log")
template(name="SJODNS" type="string" string="/var/log/remote/SJO/dns01/%PROGRAMNAME%.log")
template(name="SJOResolver" type="string" string="/var/log/remote/SJO/resolver01/%PROGRAMNAME%.log")

template(name="LIMDHCP" type="string" string="/var/log/remote/LIM/dhcp01/%PROGRAMNAME%.log")
template(name="LIMDNS" type="string" string="/var/log/remote/LIM/dns01/%PROGRAMNAME%.log")
template(name="LIMFirewall" type="string" string="/var/log/remote/LIM/firewall01/%PROGRAMNAME%.log")

template(name="OtrosEquipos" type="string" string="/var/log/remote/otros/%FROMHOST-IP%/%PROGRAMNAME%.log")

ruleset(name="remote_logs") {

    if ($fromhost-ip == "10.4.1.1") then {
        action(type="omfile" dynaFile="SJOFirewall" createDirs="on")
    } else if ($fromhost-ip == "10.4.1.10") then {
        action(type="omfile" dynaFile="SJODHCP" createDirs="on")
    } else if ($fromhost-ip == "10.4.1.20") then {
        action(type="omfile" dynaFile="SJODNS" createDirs="on")
    } else if ($fromhost-ip == "10.4.1.21") then {
        action(type="omfile" dynaFile="SJOResolver" createDirs="on")
    } else if ($fromhost-ip == "10.4.17.10") then {
        action(type="omfile" dynaFile="LIMDHCP" createDirs="on")
    } else if ($fromhost-ip == "10.4.19.20") then {
        action(type="omfile" dynaFile="LIMDNS" createDirs="on")
    } else if ($fromhost-ip == "10.4.16.1") then {
        action(type="omfile" dynaFile="LIMFirewall" createDirs="on")
    } else {
        action(type="omfile" dynaFile="OtrosEquipos" createDirs="on")
    }
}

input(type="imudp" port="514" ruleset="remote_logs")
input(type="imtcp" port="514" ruleset="remote_logs")
