include "/etc/named/transfer-g04.key";

options {
    listen-on port 53 { 127.0.0.1; 10.4.35.20; };
    listen-on-v6 port 53 { ::1; };

    directory "/var/named";

    recursion no;
    allow-recursion { none; };
    allow-query { any; };
    allow-transfer { none; };

    version "not disclosed";

    rate-limit {
        responses-per-second 10;
        window 5;
    };

    dnssec-validation no;
};

logging {
    channel query_log {
        file "/var/named/data/queries.log" versions 5 size 10m;
        severity info;
        print-time yes;
        print-category yes;
        print-severity yes;
    };

    category queries {
        query_log;
    };
};

zone "g04.ci0144.cr" IN {
    type secondary;
    file "slaves/g04.ci0144.cr.zone";
    primaries { 10.4.1.20 key "transfer-g04"; };
};

